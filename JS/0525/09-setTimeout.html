    <title>Document</title>
    <style>
      .go {
        color: green;
      }
      .stop {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="my-box">
      <h1>HELLO HELLO</h1>
    </div>
    <button class="stop-btn">stop</button>

      // console.log("C");

      const myBox = document.querySelector("#my-box");
      const startBtn = document.querySelector(".start-btn");
      const stopBtn = document.querySelector(".stop-btn");
      function flashText() {
        if (myBox.classList.contains("go")) {
          myBox.classList.remove("go");
          myBox.classList.add("stop");
        } else {
          myBox.classList.remove("stop");
          myBox.classList.add("go");
        }
      }
      // window.setInterval...
      let interValId;
      startBtn.addEventListener("click", () => {
        if (interValId) {
          return;
        }
        interValId = window.setInterval(() => {
          flashText();
        }, 1000 * 1);
      });

      stopBtn.addEventListener("click", () => {
        window.clearInterval(interValId);
        interValId = null;
      });
