<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style></style>
  </head>
  <body>
    <script>
      //解構賦值-[array]
      const arr = [1, 2, 3, 4, 5];
      // a, b, rest
      const [a, b, ...rest] = arr;
      console.log(a);
      console.log(b);
      console.log(rest);
      // let a ='123'//已經被宣告過了會報錯

      //解構賦值-{Object}
      const person = {
        name: "Andy",
        age: 18,
        gender: "male",
        country: "Taiwan",
      };
      const { name, age, country, ...others } = person;
      console.log(name);
      console.log(age);
      console.log(others);
      console.log(country);
    </script>
  </body>
</html>
