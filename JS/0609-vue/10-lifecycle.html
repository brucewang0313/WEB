<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Vue</title>
  </head>

  <body>
    <div id="app">
      <input type="text" v-model="message">
      <p>內容為：{{message}}</p>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue;

      const app = createApp({
        data() {
          return {
            message:""
          };
        },
        methods:{
          init(){
            this.message="Hi~~~"
          }
        },
        created(){
          console.log("created!")
        },
        mounted(){
          console.log("mounted!")
        },
        beforeMount(){
          console.log("beforeMount!")
        },
        updated(){
          console.log("updated!")
        }
      });
      app.mount("#app");
    </script>
  </body>
</html>
