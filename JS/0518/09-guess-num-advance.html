<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .number {
        display: flex;
        flex-wrap: wrap;
        width: 200px;
        justify-content: center;
        cursor: pointer;
      }
      .number > div {
        box-sizing: border-box;
        width: 33.333%;
        border: 1px solid red;
        border-radius: 10px;
      }
      .number > div:last-child {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div>
      <input type="text" id="num-input" />
      <button class="btnGuess">猜!</button>
      <p class="result-area">請輸入1~100之間的整數</p>
    </div>
    <div class="number panel">
      <div data-num="7">柒</div>
      <div data-num="8">捌</div>
      <div data-num="9">玖</div>
      <div data-num="4">肆</div>
      <div data-num="5">伍</div>
      <div data-num="6">陸</div>
      <div data-num="1">壹</div>
      <div data-num="2">貳</div>
      <div data-num="3">參</div>
      <div data-num="0">零</div>
    </div>

    <script>
      const myInput = document.querySelector("#num-input");
      const myBtn = document.querySelector(".btnGuess");
      const myResult = document.querySelector(".result-area");
      //floor捨棄小數點、random 0~1之間的隨機小數
      const randomNumber = Math.floor(Math.random() * 100) + 1;
      const panel = document.querySelector(".panel");
      console.log(myInput);
      console.dir(myBtn);
      let maxNum = 100;
      let minNum = 1;

      //註冊事件監聽器
      myBtn.addEventListener("click", function () {
        // console.log("已點了Button");
        console.log(`input的值是：${myInput.value}`);
        console.log(`randomNumber的值是：${randomNumber}`);
        if (myInput.value < 1 || myInput.value > 100 || isNaN(myInput.value)) {
          myResult.textContent = "請輸入1~100之間的數字 看不懂???";
          myInput.value = "";
          return;
        }

        // if(myInput.value>maxNum||myInput.value<minNum){
        //   myResult.textContent = "請輸入1~100之間的數字 看不懂???";
        // }

        if (myInput.value > randomNumber) {
          maxNum = Number(myInput.value) - 1;
          // myResult.textContent = `要輸入比${maxNum}小的數字`;
          myResult.textContent = `請輸入介於${minNum}~${maxNum}的數字`;
        } else if (myInput.value < randomNumber) {
          minNum = Number(myInput.value) + 1;
          myResult.textContent = `請輸入介於${minNum}~${maxNum}的數字`;
        } else if (myInput.value === randomNumber) {
          myResult.textContent = `答案就是：${randomNumber}`;
        }
        // myResult.textContent = myInput.value;
        myInput.value = "";
      });
      panel.addEventListener("click", function (e) {
        const numBtn = e.target;
        console.log(numBtn);
        // const theNum = numBtn.getAttribute("data-num");
        //dataset(data-)
        const theNum = numBtn.dataset.num;
        console.log(theNum);

        myInput.value += theNum;
      });
    </script>
  </body>
</html>
