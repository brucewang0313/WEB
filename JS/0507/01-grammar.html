<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script src="./01-main.js"></script>
    <script>
      //寫JS的地方
      console.log("Hi~~~~");

      //宣告變數的方式
      //var
      var x = 100;
      console.log(x);

      var x = 1000;
      console.log(x);

      var aa;
      console.log(aa);

      //let (ES6)
      let y = "Hello";
      console.log(y);

      y = "Hello world";
      console.log(y);

      //const (ES6)
      const pi = 3.14;
      console.log(pi);
      pi = 10000; //TypeError不能改變他的指向
      console.log(pi);
    </script>
  </body>
</html>
