      const people = [
        {
          name: "Bill",
          age: 47,
        },
        {
          name: "John",
          age: 37,
        },
        {
          name: "Tom",
          age: 48,

      ];

      console.log("people 原本的內容為:");
      console.log(people);
      console.log(people.filter((item) => item.age > 40));

      // Array.prototype.every 相似於C# enumerable.All
      console.log("是否所有人年紀都小於20");
      console.log(people.every((p) => p.age < 20));
      console.log("是否所有人年紀都大於30小於50");
      console.log(people.every((p) => p.age >= 30 && p.age <= 50));
      // Array.prototype.some 相似於C# enumerable.All
      console.log("是否有任何一個年紀大於40歲的人");
      console.log(people.some((p) => p.age > 40));
      console.log("是否有任何一個叫做Andy的人");
      console.log(people.some((p) => p.name === "Andy"));
