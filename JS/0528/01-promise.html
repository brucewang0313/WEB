      const getOrders = (userId) => {
        //回傳成Promise物件這樣才能設條件
        return new Promise((resolve, reject) => {
          if (isNaN(userId)) {
            reject("user id 不是數字");
          }
          const userOrders = {
            userId: userId,
            orders: ["order1", "order2", "order3", "order4"],
          };
          resolve(userOrders);
        });
      };
