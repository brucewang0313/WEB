<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //set去重複的值：唯一值
      const arr = [1, 2, 3, 4, 5, 5, 6, 7, 8];
      console.log(arr);
      const mySet = new Set(arr); //去除重複的值
      console.log(mySet);
      console.log(mySet.has(2));
      for (let item of mySet) {
        console.log(item);
      }
    </script>
  </body>
</html>
