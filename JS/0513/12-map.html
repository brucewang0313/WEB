  <body>
    <script>
      //Map key值不重複
      const myMap = new Map();
      myMap.set("a", 1);
      myMap.set("b", 2);
      myMap.set("c", 3);
      console.dir(myMap);

      console.log(myMap.get("a"));
      console.log(myMap.get("aaa")); //undefined
      myMap.set("a", 456);
      console.log(myMap.get("a"));
      console.log(myMap.size);
    </script>
  </body>
