<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models</title>
</head>

<body>
    <h1>透過List Models API取得所有模型列表</h1>
    <ul id="container" class="mb-5"></ul>

    <script>
        const modellist_ApiUrl = "https://api.openai.com/v1/models"
        let container;
        let modellist = {};

        window.onload = function () {
            container = document.getElementById("container");

            let request = new Request(modellist_ApiUrl, {
                method: "GET",
                headers: {
                    "Authorization": "Bearer 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"
                }
            });

            fetch(request)
                .then(response => {
                    //檢查response是否ok ?
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error(`發生錯誤: ${response.status}, ${response.statusText}`);
                    }
                })
                .then(modellist => {
                    let namesArray = modellist.data.map(x => x.id);
                    console.log(namesArray);
                    return namesArray
                })
                .then(modelnames => {
                    //container.innerText = JSON.stringify(modelnames);

                    modelnames.forEach((name, index) => {
                        let li = document.createElement("li");
                        li.innerText = `${++index}. ${name}`;

                        container.append(li);
                    });
                })
                .catch(ex => {
                    console.log(ex.response);
                })
                .finally(() => {

                });

        }
    </script>
</body>
</html>
