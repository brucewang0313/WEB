<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>ChatGPT - OpenAI API, Single Prompt</title>
    <style>
        input[type=text] {
            width: 70%;
        }
    </style>
</head>

<body>
    <div class="text-bg-info p-3 mb-4">
        <h1>串接ChatGPT API做互動式聊天問答(單一問題，無前後文感知)</h1>
    </div>

    <input type="text" id="question" placeholder="請輸入你的問題" value="">
    <input type="submit" id="btnSubmit" value="送出" autofocus>

    <div id="container" class="mb-5"></div>
    <div id="resultJson" class="text-bg-warning p-3 mb-4" style="visibility: hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script>
        const chatgpt_ApiUrl = "https://api.openai.com/v1/chat/completions"
        let input, btnSubmit, container, resultJson;

        let requestData = {
            "model": "gpt-3.5-turbo",
            "messages": [{ "role": "user", "content": "Hello!" }],
            "max_tokens": 2048,
            "temperature": 1
        };

        let responseData = {};

        window.onload = function () {
            questionInput = document.getElementById("question");
            btnSubmit = document.getElementById("btnSubmit");
            container = document.getElementById("container");
            resultJson = document.getElementById("resultJson");

            //當input按下Enter按鈕後,觸發Submit事件
            questionInput.addEventListener("keypress", (event) => {
                if (event.key == "Enter") {
                    event.preventDefault();
                    btnSubmit.click();
                }
            });

            //註冊Submit的Click事件
            btnSubmit.addEventListener("click", () => {
                container.innerHTML = `
                    <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                    </div>`;

                resultJson.style.visibility = "hidden";


                let question = questionInput.value;
                if (question.length > 0) {
                    requestData.messages[0].content = question;
                }

                //建立Request請求, 並設定方法,標頭及傳遞的JSON資料
                let request = new Request(chatgpt_ApiUrl, {
                    method: "POST",
                    headers: {
                        "Content-type": "application/json; charset=UTF-8",
                        "Authorization": "Bearer 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"
                    },
                    body: JSON.stringify(requestData)
                });

                btnSubmit.disabled = true;

                //fetch發出請求給ChatGPT API
                fetch(request)
                    .then(response => response.json())
                    .then(responseData => {
                        let question = `問題 : ${questionInput.value}` + "<br>";
                        container.innerHTML = question;

                        //解析ChatGPT回傳資訊格式
                        let answer = "回答 : " + responseData.choices[0].message.content + "<br>";
                                      
                        container.innerHTML = answer;

                        resultJson.innerText = JSON.stringify(responseData);
                        resultJson.style.visibility = "visible";
                    })
                    .catch(ex => {
                        console.log(ex.response);
                    })
                    .finally(() => {
                        questionInput.value = "";
                        btnSubmit.disabled = false;
                    });
            });
        }
    </script>
</body>

</html>
