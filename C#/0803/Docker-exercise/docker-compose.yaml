services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql1
    platform: linux/amd64
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MyPass@word"
    volumes:
      - sql1-db-data:/var/opt/mssql

volumes:
  sql1-db-data:
