<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card-title {
        font-size: large;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        border: 1px solid black;
        width: 300px;
        overflow: hidden;
      }
      .card-img {
        position: relative;
        width: 100%;
      }
      .hot-tag {
        background-color: red;
        color: white;
        display: inline-block; /* 讓背景只包裹文字 */
        padding: 20px 20px;
        border-radius: 20px;
        font-size: 20px;
        position: absolute;
        top: 10px;
        right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-img">
        <img src="https://picsum.photos/500/300/?random=10" />
        <div class="hot-tag">hot</div>
      </div>
      <div class="card-title">卡片標題</div>
      <div class="card-content">
        這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容
      </div>
    </div>
  </body>
</html>
