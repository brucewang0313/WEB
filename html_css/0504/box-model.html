<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Model Sample</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: orange;
            border: 5px solid #aaa;
            /* margin: 10px; */
            /* 上、下、左、右(也可以只設定2~3) */
            margin: 10px 10px 10px 10px;
            /* 上 左右 下 */
            margin: 10px 10px 10px;
            /* 上下 左右 */
            margin: 10px 10px;
            
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
