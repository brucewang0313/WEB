<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>代辦清單</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        padding-top: 30px;
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 300px;
      }
      .todoList {
        display: flex;
        flex-direction: column;
        gap: 10px;
        /* outline: 5px solid blue; */
        padding: 15px;
      }
      #add-item-btn {
        width: 100%;
        /* outline: 5px solid red; */
      }
      h1 {
        text-align: center;
      }
      label {
        letter-spacing: 3px;
        /* outline: 5px solid red; */
      }
    </style>
  </head>
  <body>
    <div
      class="container p-4 text-dark-emphasis bg-dark-subtle border border-dark-subtle rounded-4"
    >
      <main class="todoList"></main>
      <button type="button" class="btn btn-dark" id="add-item-btn">新增項目</button>
      <!-- <button type="button" class="btn btn-dark" id="delete-item-btn">刪除項目</button> -->
    </div>
    <script>
      const todoList = document.querySelector(".todoList");
      const h1 = document.createElement("h1");
      h1.textContent = "代辦清單";
      todoList.append(h1);

      for (let i = 1; i <= 3; i++) {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `checkbox{i}`;
        label.append(checkbox);
        label.append(`項目${i}`);
        todoList.append(label);
      }

      const addBtn = document.querySelector("#add-item-btn");
      addBtn.addEventListener("click", function () {
        const currentCount = todoList.querySelectorAll("label").length;
        itemCount = currentCount + 1;
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `checkbox{itemCount}`;
        label.append(checkbox);
        label.append(`項目${itemCount}`);
        todoList.append(label);
        itemCount++;
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
